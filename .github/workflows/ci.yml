name: Compilacion y pruebas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POCL_MAX_PTHREAD_COUNT: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar dependencias y OpenCL en CPU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 ocl-icd-opencl-dev pocl-opencl-icd freeglut3-dev libgl-dev libglu1-mesa-dev
      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Verificar parser, configuraciones y kernels OpenCL C 1.1 en CPU
        run: ctest --test-dir build --output-on-failure
