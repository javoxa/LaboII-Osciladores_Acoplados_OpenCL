# Ejemplo: excitacion del tercer modo de la cadena libre/fija, N=20.
# Asignaciones como parametros.py; parser de datos, no ejecuta Python.
N = 20                       # Numero de columnas; tambien se admite N=1
m = 1                        # kg
k = 40                       # N/m: acoplamiento de desplazamientos verticales
k1 = 4                       # N/m: restauracion al soporte
 dt = 0.002                  # s; debe ser menor que 2/sqrt((k1+4*k)/m)
L0 = 2                       # m: soporte en Y=0; masa dibujada en Y=-L0+y
L0_acople = 1                # m: longitud natural VISUAL del resorte acoplador
x0 = 1                       # m: distancia entre columnas
 y_eq = 0                    # m: equilibrio del resorte local; gravedad absorbida
extremo_superior_fijo = false # Ancla indice 0 a y=0, v=0
extremo_inferior_fijo = true  # Ancla indice N-1 a y=0, v=0
patron = cero                 # pulso_extremo, modo_normal, cero, arbitrario
amplitud = 0.0               # m: pulso en primera masa libre o amplitud modal
modo = 1                     # 1..numero de masas libres; libre/libre modo 1 uniforme
# y_inicial = [0, 0, ...]     # N valores ABSOLUTOS; prevalecen sobre patron
# v_inicial = [0, 0, ...]     # N valores m/s; omitido: todos cero
 tiempo_total = 0            # s; 0: ilimitado
n_pasos = 0                  # 0: sin limite adicional; para al alcanzar cualquiera
max_pasos_frame = 200         # Limita atraso; tiempo excedente se descarta y se informa
ancho = 1200                 # pixeles, par para MP4
alto = 720                   # pixeles, par para MP4
fps = 60                     # tasa objetivo render y archivo MP4
vsync = true                 # solicita GLX_EXT_swap_control en Linux
escala = 1                   # zoom: >1 acerca; ajustar para N grande
radio = 0.16                 # m: radio de masas
color_fondo = [0.025, 0.04, 0.07] # RGB [0,1]
color_masa = [0.2, 0.75, 1.0]     # RGB [0,1]
mostrar_HUD = true
editar = true                # habilita click izquierdo y arrastre vertical
soltar_velocidad_cero = false # true: v=0 al soltar; false: velocidad del ultimo movimiento
HUD_grabacion = true          # independiente del HUD en ventana
 directorio_video = grabaciones # relativo al directorio de ejecucion
 dispositivo = 0             # indice global de dispositivos OpenCL, todas las plataformas

# Excitacion sinusoidal externa aplicada SOLO a la primera masa (debe estar libre).
primer_oscilador_forzado = true  # O o checkbox del menu activa/desactiva
amplitud_fuerza = 0.5            # N; cambiar en vivo con [ ] o botones -/+
frecuencia_fuerza = 0.51329985          # Hz; cambiar en vivo con , . o botones -/+

escala_y = 1 # Amplificacion visual vertical respecto a y_eq; + / - o menu, sin alterar fisica
